version: 2.1

jobs:
  build-android:
    docker:
      - image: cimg/openjdk:17.0  # CircleCI Docker image có sẵn Java 17
    working_directory: ~/project/android  # Làm việc trong thư mục android của project
    steps:
      - checkout:
          path: ~/project  # Clone code vào ~/project
      
      - run:
          name: Install Node.js dependencies
          command: |
            cd ~/project
            yarn install
          
      - run:
          name: Install Android SDK Command Line Tools
          command: |
            sudo apt-get update
            sudo apt-get install -y wget unzip
            mkdir -p $HOME/android-sdk/cmdline-tools
            wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
            unzip cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools
            mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest

      - run:
          name: Accept Android Licenses
          command: |
            yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - run:
          name: Install Build Tools & Platform
          command: |
            export ANDROID_SDK_ROOT=$HOME/android-sdk
            export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
            sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - run:
          name: Build Release APK
          command: |
            export ANDROID_SDK_ROOT=$HOME/android-sdk
            cd ~/project/android
            ./gradlew assembleRelease

      - store_artifacts:
          path: ~/project/android/app/build/outputs/apk/release
          destination: release-apk

workflows:
  build-and-deploy:
    jobs:
      - build-android
