version: 2.1

jobs:
  build-android:
    docker:
      - image: cimg/openjdk:17.0
    working_directory: ~/project/android
    steps:
      - checkout:
          path: ~/project

      - run:
          name: Install Android SDK & Build Tools
          command: |
            sudo apt-get update
            sudo apt-get install -y wget unzip
            wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
            unzip cmdline-tools.zip
            mkdir -p $HOME/android-sdk/cmdline-tools
            mv cmdline-tools $HOME/android-sdk/cmdline-tools/latest
            yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - run:
          name: Build Android Release APK
          command: |
            export ANDROID_SDK_ROOT=$HOME/android-sdk
            cd ~/project/android
            ./gradlew assembleRelease

      - store_artifacts:
          path: ~/project/android/app/build/outputs/apk/release
          destination: release-apk

workflows:
  build-and-deploy:
    jobs:
      - build-android
